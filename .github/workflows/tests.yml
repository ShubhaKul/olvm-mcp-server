name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  docker:
    name: Docker deployment (compose + Caddy TLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Write a test configuration
        run: |
          TOKEN=$(openssl rand -hex 32)
          echo "::add-mask::$TOKEN"
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          sudo mkdir -p /etc/olvm-mcp
          printf 'ci sha256:%s\n' "$(printf '%s' "$TOKEN" | sha256sum | cut -d' ' -f1)" | sudo tee /etc/olvm-mcp/tokens >/dev/null
          echo "unused" | sudo tee /etc/olvm-mcp/engine.pw >/dev/null
          printf '%s\n' \
            "OLVM_URL=https://engine.invalid/ovirt-engine" \
            "OLVM_USERNAME=ci@internal" \
            "OLVM_PASSWORD_FILE=/etc/olvm-mcp/engine.pw" \
            "OLVM_AUTH_TOKENS_FILE=/etc/olvm-mcp/tokens" \
            "OLVM_PUBLIC_URL=https://127.0.0.1" | sudo tee /etc/olvm-mcp/olvm-mcp.env >/dev/null
          # Same permissions as deploy/README.md: secrets 0640, the env file (no secrets) 0644.
          sudo chown -R root:10001 /etc/olvm-mcp
          sudo sh -c 'chmod 755 /etc/olvm-mcp && chmod 640 /etc/olvm-mcp/* && chmod 644 /etc/olvm-mcp/olvm-mcp.env'
          echo "PUBLIC_HOST=127.0.0.1" > deploy/.env

      - name: Build and start
        working-directory: deploy
        run: docker compose up -d --build

      - name: Wait until the MCP server answers through Caddy
        # Caddy is up first and answers 502 until olvm-mcp listens; a request
        # without a token gets 401 only once the server itself is up.
        run: |
          for i in $(seq 1 60); do
            code=$(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1/mcp || true)
            [ "$code" = 401 ] && exit 0
            sleep 2
          done
          echo "last status: $code"
          exit 1

      - name: Check the server over HTTPS, trusting only Caddy's root
        working-directory: deploy
        run: |
          docker compose cp caddy:/data/caddy/pki/authorities/local/root.crt root.crt
          INIT='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}'
          HDR=(-H "Content-Type: application/json" -H "Accept: application/json, text/event-stream")

          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert root.crt "${HDR[@]}" -d "$INIT" https://127.0.0.1/mcp)
          echo "without token: $code"; test "$code" = 401

          code=$(curl -s -o /dev/null -w '%{http_code}' --cacert root.crt "${HDR[@]}" -H "Authorization: Bearer wrong" -d "$INIT" https://127.0.0.1/mcp)
          echo "wrong token: $code"; test "$code" = 401

          body=$(curl -sf --cacert root.crt "${HDR[@]}" -H "Authorization: Bearer $TOKEN" -d "$INIT" https://127.0.0.1/mcp)
          echo "with token: $body" | head -c 300; echo
          echo "$body" | grep -q '"serverInfo"'

      - name: Check the token generator in the image
        run: docker run --rm --entrypoint olvm-mcp-token olvm-mcp:local ci-check | grep -q 'ci-check sha256:'

      - name: Logs
        if: always()
        working-directory: deploy
        run: docker compose logs --no-color
