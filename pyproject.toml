[project]
name = "olvm-mcp"
version = "0.1.0"
description = "MCP server for Oracle Linux Virtualization Manager (OLVM) and oVirt"
readme = "README.md"
authors = [
    { name = "ShubhaKul", email = "shubha_kul@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp>=2.2,<3",
]

[project.scripts]
olvm-mcp = "olvm_mcp.server:main"

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
